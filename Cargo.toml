[package]
name = "installer"
version = "0.1.6"
edition = "2021"
# The lowest toolchain the crate builds and tests on. CI tests on it, so a
# dependency bump that needs a newer one fails there.
rust-version = "1.88"
publish = false
description = "Installs a bootc image onto a disk from the media that carries it"

[[bin]]
name = "tect-installer"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
# Pinned by rev, never by version. A change in `common` is a commit there and
# a bump here, which keeps the rev that was built with visible in `Cargo.lock`.
common = { git = "https://github.com/tectonic-os/common", rev = "4768623137f4901eb94c2284357d9123af0726bb" }

[profile.release]
opt-level = 1
debug = false
lto = false
codegen-units = 16
# No `panic = "abort"`. This crate closes LUKS containers, unmounts and removes
# the staged recipe in `Drop`, and an aborting build runs none of them.
strip = true

[profile.dist]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

# Renders `docs/commands.md` in a test, so it never reaches a dist binary.
[dev-dependencies]
clap-markdown = "0.1.5"
insta = { version = "1.49.0", default-features = false }
