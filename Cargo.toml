[package]
name = "installer"
version = "0.1.6"
edition = "2021"
# The lowest toolchain the crate builds and tests on. CI tests on it, so a
# dependency bump that needs a newer one fails there.
rust-version = "1.88"
publish = false
description = "Installs a bootc image onto a disk from the media that carries it"

[features]
fuzzing = ["dep:tempfile"]

[[bin]]
name = "tect-installer"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
tempfile = { version = "3.27.0", optional = true }
# Pinned by rev, never by version. A change in `common` is a commit there and
# a bump here, which keeps the rev that was built with visible in `Cargo.lock`.
common = { git = "https://github.com/tectonic-os/common", rev = "80c5601c2da11a3bc8c150ed41926e0985b31295" }

# lint.sh runs clippy with -D warnings, so a lint set to warn here also
# fails lint.sh.
[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cast_possible_truncation = "warn"
dbg_macro = "deny"
excessive_nesting = "warn"
todo = "deny"
too_many_lines = "warn"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[lints.rust]
unreachable_pub = "warn"

[profile.release]
opt-level = 1
debug = false
lto = false
codegen-units = 16
# No `panic = "abort"`. This crate closes LUKS containers, unmounts and removes
# the staged recipe in `Drop`, and an aborting build runs none of them.
strip = true

[profile.dist]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

# Renders `docs/commands.md` in a test, so it never reaches a dist binary.
[dev-dependencies]
clap-markdown = "0.1.5"
common = { git = "https://github.com/tectonic-os/common", rev = "80c5601c2da11a3bc8c150ed41926e0985b31295", features = ["test-support"] }
insta = { version = "1.49.0", default-features = false }
