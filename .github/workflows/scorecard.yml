name: Scorecard

# The Scorecard API accepts published results from `push` and `schedule` on
# the default branch alone.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * 6'

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-24.04
    permissions:
      # The SARIF upload writes to code scanning.
      security-events: write
      # `publish_results` signs the result with the workflow's OIDC token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
